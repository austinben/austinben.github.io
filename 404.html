<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ben Austin</title>
    <base href="https://benaustin.ca/">
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a" />
    <script>
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    </script>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode"></button>

    <div class="scroll">
        <main>
            <div class="name">BEN AUSTIN</div>
            <div class="mark">&#10037;</div>

            <div class="label">ERROR &mdash; 404</div>
            <h1>This page doesn't exist.</h1>

            <p>
                Sorry, the page you're looking for isn't here.
                <br><br>
                <a class="link" href="/">Back to safety</a>.
            </p>
        </main>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('theme-toggle');

            function sync() {
                var isLight = root.getAttribute('data-theme') === 'light';
                btn.textContent = isLight ? '☾' : '☀';
                btn.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
            }

            btn.addEventListener('click', function () {
                var isLight = root.getAttribute('data-theme') === 'light';
                if (isLight) {
                    root.removeAttribute('data-theme');
                    try { localStorage.setItem('theme', 'dark'); } catch (e) {}
                } else {
                    root.setAttribute('data-theme', 'light');
                    try { localStorage.setItem('theme', 'light'); } catch (e) {}
                }
                sync();
            });

            sync();
        })();
    </script>
</body>

</html>
