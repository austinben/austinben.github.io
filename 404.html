<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0c">
    <title>Ben Austin</title>
    <base href="https://benaustin.ca/">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="manifest" href="/site.webmanifest">
    <script>
        document.documentElement.classList.add('js', 'loaded');
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (e) {}
    </script>
</head>

<body>
    <div class="page">
        <header>
            <a class="logo" href="/" aria-label="Ben Austin, home">
                <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
                    <line x1="16" y1="5" x2="16" y2="27" />
                    <line x1="6.5" y1="10.5" x2="25.5" y2="21.5" />
                    <line x1="6.5" y1="21.5" x2="25.5" y2="10.5" />
                </svg>
            </a>
            <button class="toggle" id="theme-toggle" type="button">Light</button>
        </header>

        <section class="hero">
            <h1 class="title">404</h1>
            <div class="meta">Page not found</div>
            <div class="bio">
                <p>The page you're looking for isn't here.</p>
            </div>
            <a class="arrow" href="/">&larr; Back</a>
        </section>

        <figure class="art">
            <canvas id="art" aria-hidden="true"></canvas>        </figure>

        <footer>
            <nav class="index">
                <a href="mailto:hello@benaustin.ca">: EMAIL</a>
                <a href="https://www.linkedin.com/in/benjaminaaustin/">: LINKEDIN</a>
            </nav>        </footer>
    </div>

    <script src="land.js"></script>
    <script src="main.js"></script>
</body>

</html>
